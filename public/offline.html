<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Goddess Rebirth: Idle Oaths</title>
  <style>
    :root { --gold: #f5c842; --bg: #08080f; --text: #e2e8f0; --dim: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 320px; }
    .icon { font-size: 4rem; margin-bottom: 16px; }
    h1 {
      font-family: 'Palatino Linotype', Georgia, serif;
      font-size: 1.6rem;
      color: var(--gold);
      margin-bottom: 8px;
    }
    p { color: var(--dim); font-size: .9rem; line-height: 1.6; margin-bottom: 20px; }
    .note { font-size: .75rem; color: #475569; margin-top: 16px; }
    button {
      background: linear-gradient(135deg, #6d28d9, #4f1f9e);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>Your realm awaits, but the connection to the sacred realm is severed.<br>
       Check your internet and try again.</p>
    <button onclick="location.reload()">Try Again</button>
    <p class="note">Your offline progress is automatically saved and will sync when you reconnect.</p>
  </div>
</body>
</html>
